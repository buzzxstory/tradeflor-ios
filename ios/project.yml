# XcodeGen spec. The .xcodeproj is generated from this file on the macOS CI runner
# (`xcodegen generate`), so no Mac is needed to edit the project: change this file, push, CI builds.
name: Tradeflor
options:
  bundleIdPrefix: com.tradeflor
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # The one server the app talks to. Same production API the website uses.
    TF_API_BASE: "https://app.tradeflor.com/api"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 125.0.0
targets:
  Tradeflor:
    type: application
    platform: iOS
    sources:
      - path: Tradeflor
        excludes: [PrivacyInfo.xcprivacy]
      # the privacy manifest is copied into the app as a resource (audit IOS-APL-3)
      - path: Tradeflor/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WebRTC
      # the Notification Service Extension (sender and text in alerts, as WhatsApp). The signed CI build drops it when its
      # profile secret (IOS_NSE_PROFILE_BASE64) is not set yet.
      - target: TradeflorNotify
    info:
      path: Tradeflor/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tradeflor
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tradeflor.ios
            CFBundleURLSchemes: [tradeflor]
        ITSAppUsesNonExemptEncryption: false
        TFAPIBase: $(TF_API_BASE)
        TFKeychainGroup: $(AppIdentifierPrefix)com.tradeflor.ios.shared
        # Usage strings (English base; Arabic in ar.lproj/InfoPlist.strings).
        NSCameraUsageDescription: Tradeflor uses the camera so you can take photos and videos for chats and statuses.
        NSMicrophoneUsageDescription: Tradeflor uses the microphone for voice messages and calls.
        NSLocalNetworkUsageDescription: Tradeflor uses your local network to connect voice calls directly and with the best sound.
        NSPhotoLibraryUsageDescription: Tradeflor opens your photo library so you can send photos and videos and post statuses.
        NSPhotoLibraryAddUsageDescription: Tradeflor saves photos and videos you choose to keep into your library.
        NSFaceIDUsageDescription: Tradeflor uses Face ID to unlock your locked chats.
        NSLocationWhenInUseUsageDescription: Tradeflor shares your live location in a chat only when you choose to, for the time you pick, also while the app is in the background.
        # audio: a call's sound and voice-note playback with the screen locked; location: a live-location share keeps going
        # for the time picked; voip: PushKit calls. No remote-notification: nothing handles a silent push (audit IOS-APL-4).
        UIBackgroundModes: [audio, location, voip]
        # Home Screen quick actions (press and hold the icon), as WhatsApp; titles in InfoPlist.strings (App/QuickActions.swift)
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.tradeflor.ios.search
            UIApplicationShortcutItemTitle: QuickSearch
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
          - UIApplicationShortcutItemType: com.tradeflor.ios.newchat
            UIApplicationShortcutItemTitle: QuickNewChat
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
          - UIApplicationShortcutItemType: com.tradeflor.ios.camera
            UIApplicationShortcutItemTitle: QuickCamera
            UIApplicationShortcutItemIconSymbolName: camera
          - UIApplicationShortcutItemType: com.tradeflor.ios.myqr
            UIApplicationShortcutItemTitle: QuickMyQR
            UIApplicationShortcutItemIconSymbolName: qrcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradeflor.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # set by the signed CI build only (per target: the app and its extension have their own profile and entitlements)
        CODE_SIGN_ENTITLEMENTS: $(TF_APP_ENTITLEMENTS)
        PROVISIONING_PROFILE_SPECIFIER: $(TF_APP_PROFILE)
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # Device builds stay unsigned: Sideloadly/AltStore signs the IPA with the owner's own free Apple ID.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        # Simulator builds are ad-hoc signed ("-", no Apple account), so the Keychain works in the simulator.
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  TradeflorNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: TradeflorNotify
    info:
      path: TradeflorNotify/Info.plist
      properties:
        CFBundleDisplayName: Tradeflor Notifications
        TFAPIBase: $(TF_API_BASE)
        TFKeychainGroup: $(AppIdentifierPrefix)com.tradeflor.ios.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradeflor.ios.NotificationService
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: $(TF_NSE_ENTITLEMENTS)
        PROVISIONING_PROFILE_SPECIFIER: $(TF_NSE_PROFILE)
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  TradeflorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TradeflorTests
    dependencies:
      - target: Tradeflor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Tradeflor:
    build:
      targets:
        Tradeflor: all
        TradeflorTests: [test]
    test:
      targets: [TradeflorTests]
