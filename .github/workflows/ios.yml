# Builds the native Swift iPhone app on a GitHub-hosted Mac. No Apple Developer account and no signing:
# One job on one Mac (macOS minutes are billed x10 on private repos, so nothing runs twice):
#  - build + unit tests, boot an iPhone simulator, install, launch, screenshots (artifact "screenshots")
#  - unsigned Release IPA (artifact "Tradeflor-unsigned-ipa") for Sideloadly / AltStore with a free Apple ID
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   TF_CI_USERNAME, TF_CI_PASSWORD  a TEST account, never a real one: the Debug simulator build signs in to
#                                   https://app.tradeflor.com/api for the signed-in screenshots, then signs out
#   IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64  optional: a signed Ad Hoc IPA (see the "Signed Ad Hoc IPA" step)
#   SHOTS_KEY                       encrypts the screenshots artifact (decrypt: openssl enc -d -aes-256-cbc -pbkdf2
#                                   -iter 200000 -pass env:SHOTS_KEY -in screenshots.tgz.enc | tar xz)
name: iOS

on:
  push:
    branches: [ios-app]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+( Pro)?$"))] | last | .udid')
          test -n "$UDID" && test "$UDID" != "null"
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and unit-test (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tradeflor.xcodeproj -scheme Tradeflor -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build | tee build.log | grep -E "error:|warning:|Test Case|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Build unsigned Release for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tradeflor.xcodeproj -scheme Tradeflor -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-release.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-release.log
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tradeflor.app Payload/
          # Guard: the Release build must not contain the CI auto sign-in hook.
          if strings Payload/Tradeflor.app/Tradeflor | grep -q TF_CI_PASSWORD; then echo "CI hook leaked into Release"; exit 1; fi
          zip -qry Tradeflor-unsigned.ipa Payload
          ls -la Tradeflor-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Tradeflor-unsigned-ipa
          path: ios/Tradeflor-unsigned.ipa
          retention-days: 30

      # Signed Ad Hoc IPA for the owner's registered iPhone. Runs only when the three secrets below exist; without them
      # the step is skipped and the build above is unchanged. The certificate and profile are read from secrets only,
      # never from the repository, and the temporary keychain is deleted at the end.
      #   IOS_P12_BASE64      base64 of the Apple Distribution .p12
      #   IOS_P12_PASSWORD    the .p12 password
      #   IOS_PROFILE_BASE64  base64 of the Ad Hoc .mobileprovision
      - name: Check signing secrets
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_PROFILE_BASE64" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "::notice::signing secrets not set: no signed IPA"; echo "on=false" >> "$GITHUB_OUTPUT"; fi

      - name: Signed Ad Hoc IPA
        if: steps.signing.outputs.on == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: Y77J267QX7
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP_DIR/tf-signing.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP_DIR/dist.p12"
          PROF="$RUNNER_TEMP_DIR/adhoc.mobileprovision"
          echo "$IOS_P12_BASE64" | base64 --decode > "$P12"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROF"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          if ! security import "$P12" -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>import.err; then
            echo "::warning::direct .p12 import failed ($(cut -c1-120 import.err | head -1)); retrying through OpenSSL 3 (.p12 files made by OpenSSL 3 use an encryption macOS cannot read)"
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3 >/dev/null
            OSSL="$(brew --prefix openssl@3)/bin/openssl"
            export TF_P12_PW="$IOS_P12_PASSWORD"
            # a wrong password stops here with OpenSSL's own message (the password itself is never printed)
            "$OSSL" pkcs12 -in "$P12" -passin env:TF_P12_PW -nodes -out "$RUNNER_TEMP_DIR/dist.pem" || { echo "::error::the .p12 password (IOS_P12_PASSWORD) does not open the .p12 (IOS_P12_BASE64)"; exit 1; }
            "$OSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP_DIR/dist.pem" -passout env:TF_P12_PW -out "$RUNNER_TEMP_DIR/dist-legacy.p12"
            rm -f "$RUNNER_TEMP_DIR/dist.pem"
            security import "$RUNNER_TEMP_DIR/dist-legacy.p12" -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP_DIR/dist-legacy.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # the profile goes where Xcode looks for it, under its own UUID
          UUID=$(security cms -D -i "$PROF" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PROF" | plutil -extract Name raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROF" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          # the profile must be for this app's bundle identifier, else the IPA cannot be installed
          APPID=$(security cms -D -i "$PROF" | plutil -extract Entitlements.application-identifier raw -)
          case "$APPID" in *".com.tradeflor.ios") ;; *) echo "profile is for $APPID, not com.tradeflor.ios"; exit 1;; esac
          cat > ExportAdHoc.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.tradeflor.ios</key><string>$NAME</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          # Push Notifications: the app declares aps-environment only when the profile allows it (else the archive is refused)
          ENT_ARG=""
          if security cms -D -i "$PROF" | plutil -extract Entitlements.aps-environment raw - >/dev/null 2>&1; then
            ENT_ARG="CODE_SIGN_ENTITLEMENTS=Entitlements/Tradeflor.entitlements"
            echo "push entitlement ON (profile has aps-environment)"
          else
            echo "::notice::the profile has no Push Notifications: signed without remote push"
          fi
          xcodebuild archive             -project Tradeflor.xcodeproj -scheme Tradeflor -configuration Release             -sdk iphoneos -destination "generic/platform=iOS" -archivePath build/Tradeflor.xcarchive             -derivedDataPath build             CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID"             PROVISIONING_PROFILE_SPECIFIER="$NAME" CODE_SIGN_IDENTITY="Apple Distribution"             $ENT_ARG OTHER_CODE_SIGN_FLAGS="--keychain $KC" | tee build-signed.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build-signed.log
          xcodebuild -exportArchive -archivePath build/Tradeflor.xcarchive -exportPath build/signed             -exportOptionsPlist ExportAdHoc.plist | tee export.log | grep -E "error:|\*\* EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" export.log
          # verify: the IPA's signature and its embedded profile
          cp build/signed/Tradeflor.ipa Tradeflor-signed.ipa
          rm -rf verify && mkdir verify && cd verify && unzip -q ../Tradeflor-signed.ipa
          codesign --verify --deep --strict Payload/Tradeflor.app && echo "codesign ok"
          codesign -d --entitlements - Payload/Tradeflor.app 2>/dev/null | grep -q aps-environment && echo "aps-environment in the app" || echo "no aps-environment in the app"
          plutil -extract application-identifier raw Payload/Tradeflor.app/embedded.mobileprovision >/dev/null 2>&1 || true
          security cms -D -i Payload/Tradeflor.app/embedded.mobileprovision | plutil -extract Name raw - | grep -qx "$NAME"
          echo "profile $NAME embedded ok"
          cd ..
          # clean up the signing material
          security delete-keychain "$KC" || true
          rm -f "$P12" "$PROF"

      - name: Upload signed IPA
        if: steps.signing.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tradeflor-signed-adhoc-ipa
          path: ios/Tradeflor-signed.ipa
          retention-days: 30

      - name: Screenshots on a fresh simulator
        timeout-minutes: 28
        env:
          TF_CI_USERNAME: ${{ secrets.TF_CI_USERNAME }}
          TF_CI_PASSWORD: ${{ secrets.TF_CI_PASSWORD }}
        run: |
          bash scripts/ci-screenshots.sh "${{ steps.sim.outputs.udid }}"             build/Build/Products/Debug-iphonesimulator/Tradeflor.app shots

      # Screenshots show the test account's chats, and artifacts of a public repository can be downloaded by anyone:
      # they are uploaded only encrypted (AES-256, key in the SHOTS_KEY secret). Without the key, nothing is uploaded.
      - name: Encrypt screenshots
        if: always()
        env:
          SHOTS_KEY: ${{ secrets.SHOTS_KEY }}
        run: |
          if [ -z "$SHOTS_KEY" ]; then echo "::notice::SHOTS_KEY not set: screenshots are not uploaded."; exit 0; fi
          tar czf - shots build.log 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SHOTS_KEY -out screenshots.tgz.enc
          rm -rf shots
          ls -la screenshots.tgz.enc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-encrypted
          path: ios/screenshots.tgz.enc
          if-no-files-found: ignore
          retention-days: 14
