# Builds the native Swift iPhone app on a GitHub-hosted Mac. No Apple Developer account and no signing:
# One job on one Mac (macOS minutes are billed x10 on private repos, so nothing runs twice):
#  - build + unit tests, boot an iPhone simulator, install, launch, screenshots (artifact "screenshots")
#  - unsigned Release IPA (artifact "Tradeflor-unsigned-ipa") for Sideloadly / AltStore with a free Apple ID
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   TF_CI_USERNAME, TF_CI_PASSWORD  a TEST account, never a real one: the Debug simulator build signs in to
#                                   https://app.tradeflor.com/api for the signed-in screenshots, then signs out
#   IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64  optional: a signed Ad Hoc IPA (see the "Signed Ad Hoc IPA" step)
#   SHOTS_KEY                       encrypts the screenshots artifact (decrypt: openssl enc -d -aes-256-cbc -pbkdf2
#                                   -iter 200000 -pass env:SHOTS_KEY -in screenshots.tgz.enc | tar xz)
name: iOS

on:
  push:
    branches: [ios-app]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload this build to App Store Connect (TestFlight) instead of the usual build"
        type: boolean
        default: false
      version:
        description: "TestFlight only: version shown (empty = the one in ios/project.yml), e.g. 1.0"
        required: false
        default: ""

# a push cancels an older build of the same branch, never a TestFlight upload (its own group)
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.testflight && 'testflight' || 'build' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testflight) }}

permissions:
  contents: read

jobs:
  ios:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testflight) }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+( Pro)?$"))] | last | .udid')
          test -n "$UDID" && test "$UDID" != "null"
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and unit-test (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tradeflor.xcodeproj -scheme Tradeflor -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build | tee build.log | grep -E "error:|warning:|Test Case|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Build unsigned Release for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tradeflor.xcodeproj -scheme Tradeflor -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-release.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-release.log
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tradeflor.app Payload/
          # Guard: the Release build must not contain the CI auto sign-in hook.
          if strings Payload/Tradeflor.app/Tradeflor | grep -q TF_CI_PASSWORD; then echo "CI hook leaked into Release"; exit 1; fi
          zip -qry Tradeflor-unsigned.ipa Payload
          ls -la Tradeflor-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Tradeflor-unsigned-ipa
          path: ios/Tradeflor-unsigned.ipa
          retention-days: 30

      # Signed Ad Hoc IPA for the owner's registered iPhone. Runs only when the three secrets below exist; without them
      # the step is skipped and the build above is unchanged. The certificate and profile are read from secrets only,
      # never from the repository, and the temporary keychain is deleted at the end.
      #   IOS_P12_BASE64      base64 of the Apple Distribution .p12
      #   IOS_P12_PASSWORD    the .p12 password
      #   IOS_PROFILE_BASE64  base64 of the Ad Hoc .mobileprovision
      #   IOS_NSE_PROFILE_BASE64  optional: base64 of the Ad Hoc profile of the notification extension
      #                       (com.tradeflor.ios.NotificationService). Without it the IPA is built without the extension.
      - name: Check signing secrets
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_PROFILE_BASE64" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "::notice::signing secrets not set: no signed IPA"; echo "on=false" >> "$GITHUB_OUTPUT"; fi

      - name: Signed Ad Hoc IPA
        if: steps.signing.outputs.on == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_NSE_PROFILE_BASE64: ${{ secrets.IOS_NSE_PROFILE_BASE64 }}
          TEAM_ID: Y77J267QX7
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP_DIR/tf-signing.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP_DIR/dist.p12"
          PROF="$RUNNER_TEMP_DIR/adhoc.mobileprovision"
          echo "$IOS_P12_BASE64" | base64 --decode > "$P12"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROF"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          if ! security import "$P12" -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>import.err; then
            echo "::warning::direct .p12 import failed ($(cut -c1-120 import.err | head -1)); retrying through OpenSSL 3 (.p12 files made by OpenSSL 3 use an encryption macOS cannot read)"
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3 >/dev/null
            OSSL="$(brew --prefix openssl@3)/bin/openssl"
            export TF_P12_PW="$IOS_P12_PASSWORD"
            # a wrong password stops here with OpenSSL's own message (the password itself is never printed)
            "$OSSL" pkcs12 -in "$P12" -passin env:TF_P12_PW -nodes -out "$RUNNER_TEMP_DIR/dist.pem" || { echo "::error::the .p12 password (IOS_P12_PASSWORD) does not open the .p12 (IOS_P12_BASE64)"; exit 1; }
            "$OSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP_DIR/dist.pem" -passout env:TF_P12_PW -out "$RUNNER_TEMP_DIR/dist-legacy.p12"
            rm -f "$RUNNER_TEMP_DIR/dist.pem"
            security import "$RUNNER_TEMP_DIR/dist-legacy.p12" -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP_DIR/dist-legacy.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # the profile goes where Xcode looks for it, under its own UUID
          UUID=$(security cms -D -i "$PROF" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PROF" | plutil -extract Name raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROF" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          # the profile must be for this app's bundle identifier, else the IPA cannot be installed
          APPID=$(security cms -D -i "$PROF" | plutil -extract Entitlements.application-identifier raw -)
          case "$APPID" in *".com.tradeflor.ios") ;; *) echo "profile is for $APPID, not com.tradeflor.ios"; exit 1;; esac
          # the notification extension (sender and text in alerts): signed with its own profile, or left out of this IPA
          NSENAME=""
          NSE_PLIST=""
          if [ -n "${IOS_NSE_PROFILE_BASE64:-}" ]; then
            NSEPROF="$RUNNER_TEMP_DIR/nse.mobileprovision"
            echo "$IOS_NSE_PROFILE_BASE64" | base64 --decode > "$NSEPROF"
            NSEUUID=$(security cms -D -i "$NSEPROF" | plutil -extract UUID raw -)
            NSENAME=$(security cms -D -i "$NSEPROF" | plutil -extract Name raw -)
            NSEAPPID=$(security cms -D -i "$NSEPROF" | plutil -extract Entitlements.application-identifier raw -)
            case "$NSEAPPID" in *".com.tradeflor.ios.NotificationService") ;; *) echo "extension profile is for $NSEAPPID, not com.tradeflor.ios.NotificationService"; exit 1;; esac
            cp "$NSEPROF" "$HOME/Library/MobileDevice/Provisioning Profiles/$NSEUUID.mobileprovision"
            rm -f "$NSEPROF"
            NSE_PLIST="<key>com.tradeflor.ios.NotificationService</key><string>$NSENAME</string>"
            echo "notification extension ON (profile $NSENAME)"
          else
            echo "::notice::IOS_NSE_PROFILE_BASE64 not set: the IPA is built without the notification extension (alerts say New message)"
            command -v yq >/dev/null || brew install yq >/dev/null
            yq -i 'del(.targets.TradeflorNotify) | .targets.Tradeflor.dependencies |= map(select(has("target") | not))' project.yml
            xcodegen generate
          fi
          cat > ExportAdHoc.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.tradeflor.ios</key><string>$NAME</string>$NSE_PLIST</dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          # Push Notifications: the app declares aps-environment only when the profile allows it (else the archive is refused)
          ENT_ARG=""
          if security cms -D -i "$PROF" | plutil -extract Entitlements.aps-environment raw - >/dev/null 2>&1; then
            ENT_ARG="TF_APP_ENTITLEMENTS=Entitlements/Tradeflor.entitlements"
            echo "push entitlement ON (profile has aps-environment)"
          else
            echo "::notice::the profile has no Push Notifications: signed without remote push"
          fi
          xcodebuild archive             -project Tradeflor.xcodeproj -scheme Tradeflor -configuration Release             -sdk iphoneos -destination "generic/platform=iOS" -archivePath build/Tradeflor.xcarchive             -derivedDataPath build             CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID"             TF_APP_PROFILE="$NAME" TF_NSE_PROFILE="$NSENAME" TF_NSE_ENTITLEMENTS=Entitlements/TradeflorNotify.entitlements CODE_SIGN_IDENTITY="Apple Distribution"             CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES $ENT_ARG OTHER_CODE_SIGN_FLAGS="--keychain $KC" | tee build-signed.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build-signed.log
          xcodebuild -exportArchive -archivePath build/Tradeflor.xcarchive -exportPath build/signed             -exportOptionsPlist ExportAdHoc.plist | tee export.log | grep -E "error:|\*\* EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" export.log
          # verify: the IPA's signature and its embedded profile
          cp build/signed/Tradeflor.ipa Tradeflor-signed.ipa
          rm -rf verify && mkdir verify && cd verify && unzip -q ../Tradeflor-signed.ipa
          codesign --verify --deep --strict Payload/Tradeflor.app && echo "codesign ok"
          codesign -d --entitlements - Payload/Tradeflor.app 2>/dev/null | grep -q aps-environment && echo "aps-environment in the app" || echo "::warning::no aps-environment in the app (push will not work)"
          plutil -extract application-identifier raw Payload/Tradeflor.app/embedded.mobileprovision >/dev/null 2>&1 || true
          security cms -D -i Payload/Tradeflor.app/embedded.mobileprovision | plutil -extract Name raw - | grep -qx "$NAME"
          echo "profile $NAME embedded ok"
          if [ -n "$NSENAME" ]; then
            test -d Payload/Tradeflor.app/PlugIns/TradeflorNotify.appex
            codesign --verify --strict Payload/Tradeflor.app/PlugIns/TradeflorNotify.appex && echo "notification extension signed ok"
            codesign -d --entitlements - Payload/Tradeflor.app/PlugIns/TradeflorNotify.appex 2>/dev/null | grep -q "com.tradeflor.ios.shared" && echo "extension keychain group ok"
          fi
          cd ..
          # clean up the signing material
          security delete-keychain "$KC" || true
          rm -f "$P12" "$PROF"

      - name: Upload signed IPA
        if: steps.signing.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tradeflor-signed-adhoc-ipa
          path: ios/Tradeflor-signed.ipa
          retention-days: 30

      - name: Screenshots on a fresh simulator
        timeout-minutes: 28
        env:
          TF_CI_USERNAME: ${{ secrets.TF_CI_USERNAME }}
          TF_CI_PASSWORD: ${{ secrets.TF_CI_PASSWORD }}
        run: |
          bash scripts/ci-screenshots.sh "${{ steps.sim.outputs.udid }}"             build/Build/Products/Debug-iphonesimulator/Tradeflor.app shots

      # Screenshots show the test account's chats, and artifacts of a public repository can be downloaded by anyone:
      # they are uploaded only encrypted (AES-256, key in the SHOTS_KEY secret). Without the key, nothing is uploaded.
      - name: Encrypt screenshots
        if: always()
        env:
          SHOTS_KEY: ${{ secrets.SHOTS_KEY }}
        run: |
          if [ -z "$SHOTS_KEY" ]; then echo "::notice::SHOTS_KEY not set: screenshots are not uploaded."; exit 0; fi
          tar czf - shots build.log 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SHOTS_KEY -out screenshots.tgz.enc
          rm -rf shots
          ls -la screenshots.tgz.enc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-encrypted
          path: ios/screenshots.tgz.enc
          if-no-files-found: ignore
          retention-days: 14

  # Upload to App Store Connect (TestFlight): what Xcode's Product > Archive > Distribute App > App Store Connect does,
  # without a Mac. Runs ONLY when started by hand with "testflight" ticked (Actions > iOS > Run workflow); a push never
  # uploads anything to Apple. Secrets (read from secrets only; keychain, profiles and API key are deleted at the end):
  #   IOS_P12_BASE64, IOS_P12_PASSWORD   the Apple Distribution certificate (the same one the Ad Hoc build uses)
  #   IOS_APPSTORE_PROFILE_BASE64        base64 of the "App Store Connect" profile of com.tradeflor.ios
  #   IOS_APPSTORE_NSE_PROFILE_BASE64    base64 of the "App Store Connect" profile of com.tradeflor.ios.NotificationService
  #   ASC_KEY_P8_BASE64                  base64 of the App Store Connect API key file (AuthKey_XXXX.p8, role App Manager)
  #   ASC_KEY_ID, ASC_ISSUER_ID          that key's Key ID and the team's Issuer ID
  # The build number is the UTC time (YYMMDDHHMM): every upload is newer than the last, as Apple requires.
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    # App Store Connect takes only apps built with the iOS 26 SDK or later (Xcode 26+)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_APPSTORE_NSE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_NSE_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=""
          for n in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_APPSTORE_PROFILE_BASE64 IOS_APPSTORE_NSE_PROFILE_BASE64 ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then echo "::error::missing repository secrets:$missing"; exit 1; fi
          echo "all secrets present"

      - name: Pick Xcode 26 or later
        run: |
          best=""; bestv=0
          for x in /Applications/Xcode*.app; do
            v=$(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            major=${v%%.*}
            if [ "${major:-0}" -ge 26 ] 2>/dev/null; then
              n=$(echo "$v" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
              if [ "$n" -gt "$bestv" ]; then bestv=$n; best=$x; fi
            fi
          done
          if [ -z "$best" ]; then echo "::error::no Xcode 26 or later on this runner (App Store Connect needs the iOS 26 SDK)"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Archive, export and upload to App Store Connect
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_APPSTORE_NSE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_NSE_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION_INPUT: ${{ inputs.version }}
          TEAM_ID: Y77J267QX7
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP_DIR/tf-store.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP_DIR/dist.p12"
          PROF="$RUNNER_TEMP_DIR/store.mobileprovision"
          NSEPROF="$RUNNER_TEMP_DIR/store-nse.mobileprovision"
          KEYDIR="$HOME/.appstoreconnect/private_keys"
          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          cleanup() {
            security delete-keychain "$KC" >/dev/null 2>&1 || true
            rm -f "$P12" "$PROF" "$NSEPROF" "$KEYDIR/AuthKey_$ASC_KEY_ID.p8"
            rm -f "$PROFDIR"/*.mobileprovision 2>/dev/null || true
          }
          trap cleanup EXIT

          # version and build number
          BUILD="$(date -u +%y%m%d%H%M)"
          VERSION_ARG=""
          if [ -n "$VERSION_INPUT" ]; then
            echo "$VERSION_INPUT" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "::error::version must look like 1.0 or 1.0.1"; exit 1; }
            VERSION_ARG="MARKETING_VERSION=$VERSION_INPUT"
          fi
          echo "build number $BUILD ${VERSION_INPUT:+version $VERSION_INPUT}"

          # the App Store icon may not have transparency (Apple refuses the upload)
          for f in Tradeflor/Resources/Assets.xcassets/AppIcon.appiconset/*.png; do
            if [ "$(sips -g hasAlpha "$f" | awk '/hasAlpha/ {print $2}')" = "yes" ]; then echo "::error::$f has transparency"; exit 1; fi
          done

          # certificate (as the Ad Hoc build imports it)
          echo "$IOS_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          if ! security import "$P12" -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>import.err; then
            echo "::warning::direct .p12 import failed; retrying through OpenSSL 3"
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3 >/dev/null
            OSSL="$(brew --prefix openssl@3)/bin/openssl"
            export TF_P12_PW="$IOS_P12_PASSWORD"
            "$OSSL" pkcs12 -in "$P12" -passin env:TF_P12_PW -nodes -out "$RUNNER_TEMP_DIR/dist.pem" || { echo "::error::the .p12 password (IOS_P12_PASSWORD) does not open the .p12 (IOS_P12_BASE64)"; exit 1; }
            "$OSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP_DIR/dist.pem" -passout env:TF_P12_PW -out "$RUNNER_TEMP_DIR/dist-legacy.p12"
            rm -f "$RUNNER_TEMP_DIR/dist.pem"
            security import "$RUNNER_TEMP_DIR/dist-legacy.p12" -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP_DIR/dist-legacy.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          # profiles: each must be an App Store profile (no device list, not a development one) of the right identifier
          mkdir -p "$PROFDIR"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROF"
          echo "$IOS_APPSTORE_NSE_PROFILE_BASE64" | base64 --decode > "$NSEPROF"
          check_profile() { # file, expected identifier suffix, secret name
            local plist="$RUNNER_TEMP_DIR/p.plist"
            security cms -D -i "$1" > "$plist" || { echo "::error::$3 is not a provisioning profile" >&2; exit 1; }
            local appid; appid=$(plutil -extract Entitlements.application-identifier raw "$plist")
            case "$appid" in *".$2") ;; *) echo "::error::$3 is for $appid, not $2" >&2; exit 1;; esac
            if plutil -extract ProvisionedDevices raw "$plist" >/dev/null 2>&1; then
              echo "::error::$3 is an Ad Hoc or development profile (it lists devices). Create one of type App Store Connect." >&2; exit 1
            fi
            if [ "$(plutil -extract Entitlements.get-task-allow raw "$plist" 2>/dev/null || echo false)" = "true" ]; then
              echo "::error::$3 is a development profile. Create one of type App Store Connect." >&2; exit 1
            fi
            cp "$1" "$PROFDIR/$(plutil -extract UUID raw "$plist").mobileprovision"
            plutil -extract Name raw "$plist"
            rm -f "$plist"
          }
          NAME=$(check_profile "$PROF" com.tradeflor.ios IOS_APPSTORE_PROFILE_BASE64)
          NSENAME=$(check_profile "$NSEPROF" com.tradeflor.ios.NotificationService IOS_APPSTORE_NSE_PROFILE_BASE64)
          echo "profiles: $NAME / $NSENAME"
          security cms -D -i "$PROF" | plutil -extract Entitlements.aps-environment raw - >/dev/null 2>&1 \
            || { echo "::error::the app's App Store profile has no Push Notifications"; exit 1; }

          cat > ExportStore.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.tradeflor.ios</key><string>$NAME</string>
              <key>com.tradeflor.ios.NotificationService</key><string>$NSENAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild archive \
            -project Tradeflor.xcodeproj -scheme Tradeflor -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -archivePath build/Tradeflor.xcarchive \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            TF_APP_PROFILE="$NAME" TF_NSE_PROFILE="$NSENAME" \
            TF_APP_ENTITLEMENTS=Entitlements/Tradeflor.entitlements TF_NSE_ENTITLEMENTS=Entitlements/TradeflorNotify.entitlements \
            CODE_SIGN_IDENTITY="Apple Distribution" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION="$BUILD" $VERSION_ARG \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" | tee build-store.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build-store.log
          xcodebuild -exportArchive -archivePath build/Tradeflor.xcarchive -exportPath build/store \
            -exportOptionsPlist ExportStore.plist | tee export-store.log | grep -E "error:|\*\* EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" export-store.log
          IPA=build/store/Tradeflor.ipa
          test -f "$IPA"

          # verify what goes to Apple
          rm -rf verify && mkdir verify && (cd verify && unzip -q "../$IPA")
          APP=verify/Payload/Tradeflor.app
          codesign --verify --deep --strict "$APP" && echo "codesign ok"
          if strings "$APP/Tradeflor" | grep -q TF_CI_PASSWORD; then echo "::error::CI hook leaked into Release"; exit 1; fi
          test -d "$APP/PlugIns/TradeflorNotify.appex"
          V=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          B=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          XV=$(plutil -extract CFBundleShortVersionString raw "$APP/PlugIns/TradeflorNotify.appex/Info.plist")
          XB=$(plutil -extract CFBundleVersion raw "$APP/PlugIns/TradeflorNotify.appex/Info.plist")
          echo "app $V ($B), extension $XV ($XB)"
          [ "$B" = "$BUILD" ] && [ "$XB" = "$BUILD" ] && [ "$V" = "$XV" ] || { echo "::error::version or build number of the app and its extension differ"; exit 1; }
          # the entitlements as XML (newer codesign prints its own layout otherwise), read with plutil
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP_DIR/app-ent.plist" 2>/dev/null || true
          APS=$(plutil -extract aps-environment raw "$RUNNER_TEMP_DIR/app-ent.plist" 2>/dev/null || echo "")
          rm -f "$RUNNER_TEMP_DIR/app-ent.plist"
          [ "$APS" = "production" ] || { echo "::error::aps-environment is '$APS', not production"; exit 1; }
          echo "push entitlement: $APS"
          rm -rf verify

          # upload (App Store Connect API key)
          mkdir -p "$KEYDIR"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEYDIR/AuthKey_$ASC_KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$KEYDIR/AuthKey_$ASC_KEY_ID.p8" || { echo "::error::ASC_KEY_P8_BASE64 is not the base64 of a .p8 key file"; exit 1; }
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" != "0" ] || grep -qiE "ERROR ITMS|Failed to upload|error:" upload.log; then
            echo "::error::App Store Connect refused the upload (see the lines above)"; exit 1
          fi
          echo "::notice::Uploaded Tradeflor $V ($B) to App Store Connect. It appears in TestFlight after Apple processes it (about 10-30 min)."
